<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11130f">
    <title>DriveSense · Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11130f; color: #f0f2e9; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
      main { max-width: 390px; padding: 30px; border: 1px solid #30342b; border-radius: 20px; background: #1a1d17; }
      .mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: #d9ff57; color: #1b2110; font-size: 24px; font-weight: 850; }
      h1 { margin: 22px 0 8px; font-size: 23px; letter-spacing: -.05em; }
      p { color: #a4a99b; font-size: 13px; line-height: 1.7; }
      a { display: inline-flex; margin-top: 12px; color: #d9ff57; font-size: 13px; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">D</span>
      <h1>You’re offline right now.</h1>
      <p>DriveSense does not cache GPS readings or API data. Reconnect to load the app. Background location tracking is not available.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
